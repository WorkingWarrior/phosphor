name: Build

# Every push builds the firmware. A push to main also publishes the web installer (GitHub Pages) with that build;
# a tag like v1.2.0 also attaches the binaries to a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: arduino/setup-arduino-cli@v2

      - name: Install the ESP32 core
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@3.3.12 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json

      - name: Build
        run: ./build.sh

      - name: Collect the flash parts
        run: |
          mkdir -p out
          cp build/firmware.ino.bootloader.bin out/bootloader.bin
          cp build/firmware.ino.partitions.bin out/partitions.bin
          cp "$(find ~/.arduino15/packages/esp32/hardware/esp32 -name boot_app0.bin | head -1)" out/boot_app0.bin
          cp build/firmware.ino.bin out/phosphor.bin
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/

  pages:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: docs/firmware
      - name: Stamp the version into the manifest
        run: sed -i "s/__VERSION__/${GITHUB_SHA::7}/" docs/manifest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: out
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/*.bin --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
