<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phosphor Themes</title>
<style>
:root {
  --bg: oklch(0.16 0.006 200); --panel: oklch(0.2 0.008 200); --line: oklch(0.3 0.01 200);

}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }

main { max-width: 1340px; margin: 0 auto; padding: 28px 16px 120px; }
header { display: grid; gap: 14px; margin-bottom: 18px; }
h1 { font: 600 15px/1 var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--accent); margin: 0; }
.lead { margin: 0; color: var(--dim); max-width: 75ch; }
.bar { display: flex; flex-wrap: wrap; gap: 10px 22px; align-items: center; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { font: 500 13px/1 var(--mono); color: var(--dim); background: transparent; border: 0; padding: 9px 12px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--text); }
.seg button:focus-visible, a:focus-visible, textarea:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.label { font: 12px/1 var(--mono); color: var(--dim); letter-spacing: .08em; text-transform: uppercase; }
nav { position: sticky; top: 0; z-index: 2; background: color-mix(in oklch, var(--bg) 92%, transparent); backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--line); margin: 0 -16px 8px; padding: 10px 16px; display: flex; gap: 18px; flex-wrap: wrap; }
nav a { color: var(--dim); text-decoration: none; font: 500 13px/1.6 var(--mono); }
nav a:hover { color: var(--text); }
section.theme { padding: 34px 0 10px; border-bottom: 1px solid var(--line); }
.thead { display: flex; flex-wrap: wrap; gap: 10px 24px; align-items: baseline; justify-content: space-between; }
h2 { font: 600 28px/1.1 var(--mono); margin: 0; letter-spacing: .02em; }
.desc { color: var(--dim); max-width: 80ch; margin: 8px 0 18px; }
figure { margin: 0 0 22px; }
figcaption { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
figcaption span { font: 12px/1.4 var(--mono); color: var(--dim); letter-spacing: .06em; text-transform: uppercase; }
canvas.screen { display: block; width: 100%; max-width: 1280px; aspect-ratio: 640 / 172; image-rendering: pixelated;
  border-radius: 6px; box-shadow: 0 0 0 1px var(--line), 0 14px 30px -18px #000; background: #000; }
.roles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px 14px; margin: 4px 0 24px; }
.role { display: grid; grid-template-columns: 30px 1fr; gap: 2px 10px; align-items: center; }
.sw { grid-row: span 2; width: 30px; height: 30px; border-radius: 5px; box-shadow: inset 0 0 0 1px oklch(1 0 0 / .14); image-rendering: pixelated; }
.role b { font: 600 12px/1.2 var(--mono); letter-spacing: .06em; }
.role small { font: 11px/1.2 var(--mono); color: var(--dim); }
.picks { margin-top: 40px; display: grid; gap: 14px; max-width: 900px; }
.pick { display: grid; grid-template-columns: 140px auto 1fr; gap: 12px; align-items: center; }
.pick strong { font: 600 14px/1 var(--mono); }
.pick input { width: 100%; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; color: var(--text); padding: 9px 11px; font: inherit; }
textarea { width: 100%; min-height: 150px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 12px; font: 13px/1.5 var(--mono); }
.copy { justify-self: start; font: 600 13px/1 var(--mono); background: var(--accent); color: oklch(0.2 0.02 200); border: 0; border-radius: 8px; padding: 11px 16px; cursor: pointer; }
@media (max-width: 700px) { .pick { grid-template-columns: 1fr; } h2 { font-size: 22px; } }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Phosphor 1.1 · temalar</h1>
    <p class="lead">Her ekran cihazdaki gerçek 640×172 piksel, RGB565'e çevrilmiş ve 2 kat büyütülmüş. Her tema için A/B varyantını seç, istersen not yaz; en alttaki “Seçimleri kopyala” ile bana gönder.</p>
    <div class="bar">
      <span class="label">Dil</span>
      <div class="seg" id="lang"><button data-v="en" aria-pressed="true">EN</button><button data-v="tr" aria-pressed="false">TR</button></div>
      <span class="label">Hareket</span>
      <div class="seg" id="anim"><button data-v="1" aria-pressed="true">Açık</button><button data-v="0" aria-pressed="false">Durdur</button></div>
    </div>
  </header>
  <nav id="nav"></nav>
  <div id="themes"></div>
  <section class="picks" id="picks">
    <h2>Seçimler</h2>
    <div id="pickrows"></div>
    <textarea id="out" readonly aria-label="Seçim özeti"></textarea>
    <button class="copy" id="copy">Seçimleri kopyala</button>
  </section>
</main>

      let c;
      if (n === 1) c = ramp[0];

        const f = Math.max(0, Math.min(1, S.val[i])) * (n - 1);
        if (opt.band) c = ramp[Math.round(f)];
        else { const k = Math.floor(f); c = (k + 1 < n && bayer(bx, y) < f - k) ? ramp[k + 1] : ramp[k]; }

      for (const c of cl) for (let j = 0; j < 11; j++) fb.rect(c[0], c[1] + j, 11, 1, COPPER[Math.min(COPPER.length - 1, Math.floor((c[1] + j - 42) / 77 * COPPER.length))]);

        T(fb, DEMO.station, 10, 38, 2, V.c1);
        T(fb, 'CH0' + DEMO.ch, 222, 38, 2, V.c2);
        // pattern
        fb.rect(6, 56, 338, 74, 0x000000); bevel(fb, V, 4, 54, 342, 78, false);
        const row = Math.floor(t / 150), NOTES = ['C-3', 'D#3', 'F-3', 'G-3', 'A#3', 'C-4', 'D#4', 'G-2', 'F-2', 'A#2'];
        const BAR = ['#420', '#730', '#A50', '#D70', '#F90', '#D70', '#A50', '#730', '#420'].map(x12);

      scene(fb, { t, P: V }) {

  const THEMES = [VFD, CGA, EGA, C64, AMIGA];

// Review page: every theme's screens on canvases, variant switch, palette roles, font sheet and a picks summary.
(function () {
  const { PH, PHT } = window;
  const LABEL = { clock: 'Saat', alarm: 'Alarm çalıyor', radio: 'Radyo', scene: 'Sahne: deniz feneri', settings: 'Ayarlar' };
  const state = { lang: 'en', anim: true, variant: {}, note: {} };
  try { Object.assign(state, JSON.parse(localStorage.getItem('phosphor-themes') || '{}')); } catch (e) { /* private mode */ }
  const save = () => { try { localStorage.setItem('phosphor-themes', JSON.stringify({ variant: state.variant, note: state.note })); } catch (e) { /* ignore */ } };
  const items = [];
  const $ = (tag, attrs = {}, kids = []) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) if (k === 'text') el.textContent = v; else el.setAttribute(k, v);
    for (const k of [].concat(kids)) if (k) el.append(k);

  const hex = (c) => PH.toHex(PH.from565(PH.to565(c)));
  const c565 = (c) => '0x' + PH.to565(c).toString(16).toUpperCase().padStart(4, '0');

  function screenCanvas(theme, screen, kind = 'screen') {
    const cv = $('canvas', { class: 'screen', width: 640, height: 172, role: 'img', 'aria-label': `${theme} ${screen}` });
    const item = { cv, ctx: cv.getContext('2d'), img: null, theme, screen, kind, last: -1e9, visible: true, fb: new PH.Fb() };
    item.img = item.ctx.createImageData(640, 172);

  }
  function draw(item, t) {
    const v = state.variant[item.theme] || 'a';
    if (item.kind === 'font') PHT.specimen(item.fb, item.theme, v);
    else PHT.render(item.fb, item.theme, v, item.screen, t, state.lang);
    item.fb.rgba(item.img.data);
    item.ctx.putImageData(item.img, 0, 0);
    item.last = t;
  }
  function roles(el, th) {
    el.textContent = '';
    const V = th.variants[state.variant[th.key] || 'a'];
    for (const [name, r] of Object.entries(th.roles(V))) {

        const R = th.roles(V), a = PHT.flat(R[r.dither[0]]), b = PHT.flat(R[r.dither[1]]);

        el.append($('div', { class: 'role' }, [cv, $('b', { text: name }), $('small', { text: `dither ${Math.round(r.dither[2] * 100)}% · ${hex(r.flat)}` })]));
        continue;
      }
      sw.style.background = hex(r);
      sub = `${hex(r)} · ${c565(r)}`;
      el.append($('div', { class: 'role' }, [sw, $('b', { text: name }), $('small', { text: sub })]));
    }
  }

  const nav = document.getElementById('nav'), root = document.getElementById('themes'), pickrows = document.getElementById('pickrows');
  const roleEls = {};
  for (const th of PHT.THEMES) {
    const name = PHT.THEME_NAMES[PHT.THEMES.indexOf(th)];
    nav.append($('a', { href: '#t-' + th.key, text: name }));
    const sec = $('section', { class: 'theme', id: 't-' + th.key });
    const head = $('div', { class: 'thead' }, [$('h2', { text: name })]);
    const keys = Object.keys(th.variants);
    if (keys.length > 1) {
      const seg = $('div', { class: 'seg', role: 'group', 'aria-label': name + ' varyant' });

        const b = $('button', { 'data-v': k, 'aria-pressed': String((state.variant[th.key] || 'a') === k), text: `${k.toUpperCase()} · ${th.variants[k].label}` });
        b.onclick = () => {

          seg.querySelectorAll('button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));

        };
        seg.append(b);
      }
      head.append(seg);

    sec.append(head, $('p', { class: 'desc', text: th.desc }));
    for (const sc of PHT.SCREENS) if (th[sc]) sec.append($('figure', {}, [$('figcaption', {}, [$('span', { text: LABEL[sc] })]), screenCanvas(th.key, sc)]));

    const re = $('div', { class: 'roles' }); roleEls[th.key] = re; roles(re, th);
    sec.append($('figcaption', {}, [$('span', { text: 'Firmware rolleri (palettes.json)' })]), re);
    root.append(sec);
    // picks row
    const pick = $('div', { class: 'pick' }, [$('strong', { text: name })]);
    const sel = $('div', { class: 'seg' });
    for (const k of keys) {
      const b = $('button', { 'aria-pressed': String((state.variant[th.key] || 'a') === k), text: k.toUpperCase() });
      b.onclick = () => sec.querySelector(`.thead button[data-v="${k}"]`)?.click() || (state.variant[th.key] = k);
      sel.append(b);
    }

  }
  function summary() {
    document.querySelectorAll('.pick').forEach((row, i) => {
      const th = PHT.THEMES[i], v = state.variant[th.key] || 'a';

    }).join('\n');
  }
  summary();
  document.getElementById('copy').onclick = async () => {
    const out = document.getElementById('out');
    try { await navigator.clipboard.writeText(out.value); document.getElementById('copy').textContent = 'Kopyalandı'; } catch (e) { out.select(); document.execCommand('copy'); }
  };
  for (const [id, key] of [['lang', 'lang'], ['anim', 'anim']]) {
    const seg = document.getElementById(id);
    seg.querySelectorAll('button').forEach((b) => b.onclick = () => {
      state[key] = key === 'anim' ? b.dataset.v === '1' : b.dataset.v;

    const now = performance.now() - t0, t = state.anim ? now : frozen;

      if ((state.anim && now - it.last >= every) || it.last < -1e8) draw(it, t);

  })();
})();
